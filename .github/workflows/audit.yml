name: audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zanity:
    name: zanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: benomahony/zanity@97db0c56358db8ff895bbbe349d4014543df89fa # v0.1.30
        with:
          version: 0.1.30
          args: check . --fail-on warning --strict

  consistency:
    name: consistency
    runs-on: ubuntu-latest
    env:
      GATED_DELIVERY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Plugin consistency
        run: node scripts/audit/consistency.mjs
      - name: Hook behaviour tests
        run: node --test plugin/hooks/*.test.mjs
      - name: Script tests (the guard and the eval runner)
        run: node --test scripts/audit/*.test.mjs scripts/eval/*.test.mjs
      - name: Eval checks are runnable
        run: node scripts/eval/run-checks.mjs --lint
      - name: Leak guard self-test
        run: bash tests/leak-guard.test.sh
      - name: Slice worktree and verify-lock tests
        run: bash tests/slice-scripts.test.sh
