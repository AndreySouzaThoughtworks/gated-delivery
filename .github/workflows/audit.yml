name: audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zanity:
    name: zanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: benomahony/zanity@7fd1880c9c509019f7b87a8b506a6b78599bc8c7 # v0.1.39
        with:
          version: 0.1.39
          args: check . --baseline zanity-baseline.json --new-only --agent --fail-on warning --strict

  consistency:
    name: consistency
    runs-on: ubuntu-latest
    env:
      GATED_DELIVERY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Plugin consistency
        run: node scripts/audit/consistency.mjs
      - name: Suppression guard
        run: node scripts/audit/suppressions.mjs
      - name: Zanity baseline only shrinks
        if: github.event_name == 'pull_request'
        run: node plugin/bootstrap/guards/ratchet.mjs --baseline zanity-baseline.json --base-ref "$GATED_DELIVERY_BASE_REF"
      - name: Hook behaviour tests
        run: node --test plugin/hooks/*.test.mjs
      - name: Script tests (the guard and the eval runner)
        run: node --test scripts/audit/*.test.mjs scripts/eval/*.test.mjs
      - name: Bootstrap and client guard tests
        run: node --test plugin/bootstrap/*.test.mjs plugin/bootstrap/guards/*.test.mjs
      - name: Eval checks are runnable
        run: node scripts/eval/run-checks.mjs --lint
      - name: Leak guard self-test
        run: bash tests/leak-guard.test.sh
      - name: Slice worktree and verify-lock tests
        run: bash tests/slice-scripts.test.sh

  guardrail-scripts:
    name: guardrail scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify-command resolver tests
        run: node --test scripts/*.test.mjs
      - name: Spec lint accepts the known-good spec
        run: node scripts/audit/spec-lint.mjs scripts/audit/fixtures/valid-spec.md
      - name: Deskcheck lint accepts the known-good page
        run: node scripts/audit/deskcheck-lint.mjs scripts/audit/fixtures/deskcheck/valid.html
      - name: Guardrail scan accepts the issue-writing templates and examples
        run: |
          for file in plugin/skills/issue-writing/templates/*.md plugin/skills/issue-writing/examples/*.md; do
            node scripts/audit/guardrail-scan.mjs "$file"
          done
