name: evals

on:
  pull_request:
    paths:
      - plugin/skills/**
      - plugin/agents/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-evals:
    name: skill evals
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Check for the eval token
        id: token
        run: |
          present=false
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then present=true; fi
          echo "has_token=$present" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.has_token == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.token.outputs.has_token == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - if: steps.token.outputs.has_token == 'true'
        working-directory: tools/claude-code
        run: |
          npm ci --ignore-scripts
          node node_modules/@anthropic-ai/claude-code/install.cjs
      - if: steps.token.outputs.has_token == 'true'
        run: node scripts/eval/changed-skills.mjs
        env:
          GATED_DELIVERY_BASE_REF: origin/${{ github.base_ref }}
          GATED_DELIVERY_CLAUDE_BIN: ${{ github.workspace }}/tools/claude-code/node_modules/.bin/claude
