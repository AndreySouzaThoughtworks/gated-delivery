<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Three slices pass a gate</title>
<desc id="hero-desc">Three rounded bars of growing length move from left to right. A vertical gate bar stands in the middle. The longest bar passes the gate and ends in a green check mark.</desc>
<defs>
<linearGradient id="hero-gradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
<linearGradient id="hero-panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a47"/><stop offset="1" stop-color="#1b1030"/></linearGradient>
</defs>
<rect x="1" y="1" width="518" height="298" rx="24" fill="url(#hero-panel)" stroke="#5b4a8a" stroke-width="2"/>
<rect x="36" y="52" width="230" height="40" rx="20" fill="url(#hero-gradient)" opacity=".45"/>
<rect x="36" y="130" width="320" height="40" rx="20" fill="url(#hero-gradient)" opacity=".75"/>
<rect x="36" y="208" width="400" height="40" rx="20" fill="url(#hero-gradient)"/>
<rect x="286" y="26" width="20" height="248" rx="10" fill="#f1ebff"/>
