<radialGradient id="scene-horizon" cx=".5" cy=".68" r=".55"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
<linearGradient id="scene-mesa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a38"/><stop offset="1" stop-color="#241520"/></linearGradient>
<linearGradient id="scene-stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a7470"/><stop offset="1" stop-color="#5a3c42"/></linearGradient>
<radialGradient id="scene-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d4ffec"/><stop offset=".35" stop-color="#34d399"/><stop offset="1" stop-color="#0a5a42"/></radialGradient>
<radialGradient id="scene-halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#34d399" stop-opacity=".55"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<linearGradient id="scene-ray" gradientUnits="userSpaceOnUse" x1="0" y1="470" x2="0" y2="0"><stop offset="0" stop-color="#6ee7b7" stop-opacity=".3"/><stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/></linearGradient>
<linearGradient id="scene-spill" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="700"><stop offset="0" stop-color="#34d399" stop-opacity=".6"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
<style>
.mote { fill: #fae8d0; opacity: .55; }
@media (prefers-reduced-motion: no-preference) {
.mote { animation: scene-drift 9s ease-in-out infinite alternate; }
.mote:nth-of-type(2n) { animation-duration: 12s; animation-delay: -4s; }
.mote:nth-of-type(3n) { animation-duration: 15s; animation-delay: -8s; }
}
@keyframes scene-drift { from { transform: translate(0, 0); } to { transform: translate(26px, -22px); } }
</style>
