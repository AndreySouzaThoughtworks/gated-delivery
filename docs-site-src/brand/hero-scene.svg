<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="scene-title scene-desc">
<title id="scene-title">An emerald gem glows behind a temple gate</title>
<desc id="scene-desc">A desert at dusk. The sky runs from deep plum at the top to amber at the horizon, with a few stars. Layered dunes and mesas stand in the distance. Worn stone steps climb to a large portcullis gate carved into a mesa. Emerald light shines through the bars, and a faceted gem is visible between them.</desc>
