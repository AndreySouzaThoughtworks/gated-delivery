<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gated-delivery social card</title>
<style>
@font-face { font-family: "Karma"; src: url("../fonts/Karma-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; background: #2a2227; color: #fae8d0; font-family: Karma, Georgia, serif; }
.scene { position: absolute; inset: 0; width: 1200px; height: 630px; object-fit: cover; object-position: 50% 100%; }
.plate { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 760px; text-align: center; padding: 18px 40px 20px; background: linear-gradient(180deg, #46393d, #3a2f33); border: 2px solid #f3dc7f; box-shadow: inset 0 0 0 7px #3a2f33, inset 0 0 0 8px rgba(243, 220, 127, 0.6), inset 0 4px 14px rgba(0, 0, 0, 0.3), 0 14px 36px rgba(0, 0, 0, 0.5); }
.lockup { display: flex; align-items: center; justify-content: center; gap: 22px; }
.lockup img { width: 72px; height: 72px; }
.wordmark { white-space: nowrap; font-size: 64px; font-weight: 700; line-height: 1; text-shadow: 0 3px 0 rgba(35, 26, 28, 0.7); }
.tagline { margin: 10px 0 0; font-size: 32px; font-weight: 700; color: #f3dc7f; }
</style>
</head>
<body>
<img class="scene" src="hero-scene.svg" alt="">
<div class="plate">
<div class="lockup"><img src="mark.svg" alt=""><span class="wordmark">gated-delivery</span></div>
<p class="tagline">Gate it. Slice it. Prove it.</p>
</div>
</body>
</html>
