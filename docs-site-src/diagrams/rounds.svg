<svg viewBox="0 0 360 436" role="img" aria-labelledby="rounds-title rounds-desc" focusable="false">
<title id="rounds-title">A round of batches</title>
<desc id="rounds-desc">Batches of one slice that do not build on each other run side by side, each in its own batch tree. The orchestrator picks their commits onto the slice in plan order. A later batch that builds on them runs in the next round. A strict chain stays sequential.</desc>
<text class="dg-label" x="20" y="32">ROUND: BATCHES OF ONE SLICE</text>
<text class="dg-note" x="20" y="56">Round 1: batches that do not build on each other</text>
<rect class="dg-gate" x="20" y="70" width="150" height="70" rx="8"/>
<text class="dg-text" x="32" y="92">Batch 1</text>
<text class="dg-note" x="32" y="110">own batch tree</text>
<text class="dg-note" x="32" y="125">no shared files</text>
<rect class="dg-gate" x="190" y="70" width="150" height="70" rx="8"/>
<text class="dg-text" x="202" y="92">Batch 2</text>
<text class="dg-note" x="202" y="110">own batch tree</text>
<text class="dg-note" x="202" y="125">no shared files</text>
<path class="dg-arrow" d="M89 144 L101 144 L95 151 Z"/>
<path class="dg-arrow" d="M259 144 L271 144 L265 151 Z"/>
<rect class="dg-box" x="20" y="156" width="320" height="60" rx="8"/>
<text class="dg-text" x="40" y="180">Picked onto the slice</text>
<text class="dg-note" x="40" y="200">batch-pick.sh, in plan order</text>
<path class="dg-arrow" d="M174 220 L186 220 L180 227 Z"/>
<text class="dg-note" x="20" y="248">Round 2: batches that build on round 1</text>
<rect class="dg-gate" x="20" y="262" width="320" height="60" rx="8"/>
<text class="dg-text" x="40" y="286">Batch 3 builds on batches 1 and 2</text>
<text class="dg-note" x="40" y="306">A round of one runs in the slice's own tree</text>
<path class="dg-arrow" d="M174 326 L186 326 L180 333 Z"/>
<rect class="dg-human" x="20" y="338" width="320" height="60" rx="8"/>
<text class="dg-text" x="40" y="362">Picked onto the slice</text>
<text class="dg-note" x="40" y="382">Then the reviews and the suite run</text>
<text class="dg-note" x="20" y="418">A strict chain stays sequential.</text>
</svg>
