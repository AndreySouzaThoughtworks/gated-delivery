<svg viewBox="0 0 360 656" role="img" aria-labelledby="slice-batch-title slice-batch-desc" focusable="false">
<title id="slice-batch-title">One batch inside a slice</title>
<desc id="slice-batch-desc">Seven steps in order. Plan the batch. The executor writes a failing test, then code. A script audits the commits. A design review runs when the slice has more than one batch. A security review runs when inputs, authorization or secrets change. The test suite runs when the tip moved. The draft pull request is opened or updated.</desc>
<text class="dg-label" x="20" y="32">FOR EACH BATCH</text>
<rect class="dg-box" x="20" y="48" width="320" height="68" rx="8"/>
<text class="dg-text" x="40" y="76">Plan the batch</text>
<text class="dg-note" x="40" y="98">One subject, one seam</text>
<path class="dg-arrow" d="M174 119 L186 119 L180 127 Z"/>
<rect class="dg-box" x="20" y="130" width="320" height="68" rx="8"/>
<text class="dg-text" x="40" y="158">Executor: failing test, then code</text>
<text class="dg-note" x="40" y="180">One commit per criterion</text>
<path class="dg-arrow" d="M174 201 L186 201 L180 209 Z"/>
<rect class="dg-gate" x="20" y="212" width="320" height="68" rx="8"/>
<text class="dg-text" x="40" y="240">Commit audit</text>
<text class="dg-note" x="40" y="262">batch-audit.mjs checks the commits</text>
<path class="dg-arrow" d="M174 283 L186 283 L180 291 Z"/>
<rect class="dg-gate" x="20" y="294" width="320" height="68" rx="8"/>
<text class="dg-text" x="40" y="322">Design review</text>
<text class="dg-note" x="40" y="344">Only if the slice has 2 or more batches</text>
<path class="dg-arrow" d="M174 365 L186 365 L180 373 Z"/>
<rect class="dg-gate" x="20" y="376" width="320" height="68" rx="8"/>
<text class="dg-text" x="40" y="404">Security review</text>
<text class="dg-note" x="40" y="426">Only when inputs, auth or secrets change</text>
<path class="dg-arrow" d="M174 447 L186 447 L180 455 Z"/>
<rect class="dg-gate" x="20" y="458" width="320" height="68" rx="8"/>
<text class="dg-text" x="40" y="486">Run the test suite</text>
<text class="dg-note" x="40" y="508">Only if the tip moved since the last verify</text>
<path class="dg-arrow" d="M174 529 L186 529 L180 537 Z"/>
<rect class="dg-box" x="20" y="540" width="320" height="68" rx="8"/>
<text class="dg-text" x="40" y="568">Draft pull request</text>
<text class="dg-note" x="40" y="590">pr-gate.mjs checks the body and title</text>
<text class="dg-note" x="20" y="636">Next batch: repeat. Last batch: go to the slice end.</text>
</svg>
