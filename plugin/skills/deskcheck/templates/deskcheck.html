<!DOCTYPE html>
<!--
  DESKCHECK SHELL
  Replace the five document placeholders. Write the narrative as semantic HTML in DESKCHECK_BODY.
  Keep the output static with embedded CSS and assets.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TICKET_ID}} — {{TITLE}} — Deskcheck</title>
<style>
  :root {
    --paper: #FFFFFF;
    --surface: #F4F5F7;
    --surface-soft: #E9EBEF;
    --border: #D5D9E0;
    --ink: #1C1E21;
    --muted: #5A6270;
    --blue-soft: #DCE9F7;
    --blue: #7AA7D6;
    --orange: #E8590C;
    --success: #2F9E44;
    --warning: #E0A800;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--ink); text-underline-offset: 3px; }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible, summary:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 3px;
    border-radius: 4px;
  }

  .skip-link {
    position: absolute;
    left: 16px;
    top: -64px;
    z-index: 10;
    padding: 8px 12px;
    background: var(--ink);
    color: var(--surface);
  }
  .skip-link:focus { top: 16px; }

  .page {
    width: min(1040px, calc(100% - 48px));
    margin: 0 auto;
    padding: 48px 0 96px;
  }

  .accent {
    width: 48px;
    height: 4px;
    margin-bottom: 16px;
    border-radius: 4px;
    background: var(--orange);
  }

  .eyebrow {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  h1, h2, h3, p { margin-top: 0; }
  h1 {
    max-width: 820px;
    margin-bottom: 12px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(36px, 7vw, 60px);
    font-weight: 400;
    letter-spacing: -.035em;
    line-height: 1.05;
  }
  h2 {
    margin-bottom: 16px;
    font-size: clamp(25px, 4vw, 34px);
    letter-spacing: -.02em;
    line-height: 1.15;
  }
  h3 {
    margin-bottom: 8px;
    font-size: 18px;
    line-height: 1.25;
  }

  header .outcome {
    max-width: 760px;
    margin-bottom: 24px;
    color: var(--muted);
    font-size: 20px;
  }

  .ticket-link {
    display: inline-block;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    font-size: 13px;
    font-weight: 600;
  }

  .notice {
    margin: 24px 0 0;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-left: 4px solid var(--warning);
    border-radius: 8px;
    background: var(--surface-soft);
    font-size: 13px;
  }

  main { margin-top: 56px; }
  section { scroll-margin-top: 24px; }
  section + section { margin-top: 72px; }

  .value {
    padding: clamp(24px, 5vw, 48px);
    border: 1px solid var(--blue);
    border-left: 6px solid var(--blue);
    border-radius: 8px;
    background: var(--surface);
  }
  .value h2 { max-width: 760px; }
  .value p:last-child { margin-bottom: 0; }
  .value .lead {
    max-width: 760px;
    font-size: 19px;
  }

  .section-intro {
    max-width: 760px;
    color: var(--muted);
    font-size: 17px;
  }

  .joke {
    max-width: 760px;
    font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", cursive;
    font-size: 19px;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0 0;
    padding: 0;
    list-style: none;
  }
  .links a {
    display: inline-block;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    font-size: 13px;
    font-weight: 600;
  }

  .setup {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin: 24px 0;
  }
  .setup article {
    min-width: 0;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-soft);
  }
  .setup p { margin-bottom: 0; font-size: 14px; }

  .steps {
    margin: 24px 0 0;
    padding: 0;
    list-style: none;
    counter-reset: demo-step;
  }
  .steps li {
    position: relative;
    margin: 0 0 16px;
    padding: 20px 20px 20px 72px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    counter-increment: demo-step;
  }
  .steps li::before {
    content: counter(demo-step);
    position: absolute;
    left: 20px;
    top: 20px;
    display: grid;
    width: 32px;
    height: 32px;
    place-items: center;
    border-radius: 4px;
    background: var(--blue);
    color: var(--surface);
    font-size: 14px;
    font-weight: 700;
  }
  .steps p { margin-bottom: 8px; }
  .steps p:last-child { margin-bottom: 0; }
  .expected {
    padding-top: 8px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
  }
  .expected strong { color: var(--success); }

  .approach-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin-top: 24px;
  }
  .approach-grid article {
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  .approach-grid p:last-child { margin-bottom: 0; }

  details {
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  summary {
    cursor: pointer;
    padding: 16px 20px;
    font-weight: 700;
  }
  details[open] summary { border-bottom: 1px solid var(--border); }
  .detail-body { padding: 20px; }
  .detail-body > :last-child { margin-bottom: 0; }

  .feedback {
    padding: clamp(24px, 5vw, 40px);
    border-radius: 8px;
    background: var(--ink);
    color: var(--surface);
  }
  .feedback .eyebrow, .feedback .section-intro { color: var(--blue-soft); }
  .feedback ol { margin: 24px 0 0; padding-left: 24px; }
  .feedback li { margin: 12px 0; padding-left: 8px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  code { font-size: .9em; overflow-wrap: anywhere; }
  .notes {
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  .notes > :last-child { margin-bottom: 0; }

  footer {
    margin-top: 72px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }

  @media (max-width: 720px) {
    .page { width: min(100% - 32px, 1040px); padding-top: 32px; }
    .setup, .approach-grid { grid-template-columns: 1fr; }
    section + section { margin-top: 56px; }
    .steps li { padding-left: 64px; }
    .steps li::before { left: 16px; }
  }

  @media print {
    body { background: var(--surface); }
    .page { width: 100%; padding: 0; }
    .skip-link { display: none; }
    section + section { margin-top: 40px; }
    details { break-inside: avoid; }
    details .detail-body { display: block; }
    a { text-decoration: none; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#content">Skip to deskcheck</a>
<div class="page">
  <header>
    <div class="accent"></div>
    <p class="eyebrow">Deskcheck</p>
    <h1>{{TITLE}}</h1>
    <a class="ticket-link" href="{{TICKET_URL}}">{{TICKET_ID}}</a>
    <p class="notice"><strong>Internal working document.</strong> Prepared to support a shared walkthrough and feedback.</p>
  </header>

  <main id="content">
    {{DESKCHECK_BODY}}
  </main>

  <footer>
    <strong>{{TICKET_ID}} deskcheck</strong> · Prepared {{PREPARED_DATE}}<br>
    <em>Generated with Claude AI. Review before sharing.</em>
  </footer>
</div>
</body>
</html>
